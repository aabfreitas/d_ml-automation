! ---------------------------------------------------------------------------
! Site A - FortiGate 60F
! Configuração de referência: VPN IPSec route-based para Palo Alto (Site B)
! Gerada a partir de examples/inventario_vpn.yaml
! A PSK é substituída em tempo de execução por $VPN_PSK.
! ---------------------------------------------------------------------------

config vpn ipsec phase1-interface
    edit "VPN_TO_PALO"
        set interface "port1"
        set ike-version 2
        set keylife 28800
        set peertype any
        set net-device disable
        set proposal aes256-sha256
        set dhgrp 14
        set nattraversal enable
        set dpd on-idle
        set dpd-retryinterval 10
        set remote-gw 198.51.100.20
        set psksecret ENC $VPN_PSK
    next
end

config vpn ipsec phase2-interface
    edit "VPN_TO_PALO_P2"
        set phase1name "VPN_TO_PALO"
        set proposal aes256-sha256
        set dhgrp 14
        set pfs enable
        set replay enable
        set keylifeseconds 3600
        set src-subnet 0.0.0.0 0.0.0.0
        set dst-subnet 0.0.0.0 0.0.0.0
    next
end

config system interface
    edit "VPN_TO_PALO"
        set vdom "root"
        set ip 169.255.1.1 255.255.255.255
        set remote-ip 169.255.1.2 255.255.255.252
        set allowaccess ping
        set type tunnel
        set interface "port1"
    next
end

config firewall address
    edit "LAN_SITE_A"
        set subnet 10.10.0.0 255.255.255.0
    next
    edit "LAN_SITE_B"
        set subnet 10.20.0.0 255.255.255.0
    next
end

config router static
    edit 10
        set dst 10.20.0.0 255.255.255.0
        set device "VPN_TO_PALO"
        set comment "Rota para a LAN do Site B via tunel IPSec"
    next
end

config firewall policy
    edit 100
        set name "SITE_A_PARA_SITE_B"
        set srcintf "internal"
        set dstintf "VPN_TO_PALO"
        set srcaddr "LAN_SITE_A"
        set dstaddr "LAN_SITE_B"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat disable
        set logtraffic all
    next
    edit 101
        set name "SITE_B_PARA_SITE_A"
        set srcintf "VPN_TO_PALO"
        set dstintf "internal"
        set srcaddr "LAN_SITE_B"
        set dstaddr "LAN_SITE_A"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat disable
        set logtraffic all
    next
end

! Verificação
!   get vpn ipsec tunnel details
!   diagnose vpn ike gateway list name VPN_TO_PALO
!   diagnose vpn tunnel list name VPN_TO_PALO
!   execute ping-options source 169.255.1.1
!   execute ping 169.255.1.2
