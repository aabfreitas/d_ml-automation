# CD-SP1-DHCP001 — servidor DHCP (container Linux, dnsmasq)
# Extraído do laboratório em 22/09/2026.

# --- Rede (/etc/network/interfaces) ---
auto lo
iface lo inet loopback

auto eth0
iface eth0 inet static
    address 192.168.50.10
    netmask 255.255.255.0
    gateway 192.168.50.1

# --- Serviço DHCP (/etc/dnsmasq.conf) ---
# Só DHCP: a função de DNS do dnsmasq fica desativada (port=0), porque a
# resolução de nomes é entregue direto pelo Google/Cloudflare via
# dhcp-option, não por este servidor.

interface=eth0
port=0

# --- POOL REDE 10 (VLAN 10 / VLAN_DADOS: 192.168.10.0/24) ---
dhcp-range=set:rede10,192.168.10.100,192.168.10.200,255.255.255.0,12h
dhcp-option=tag:rede10,option:router,192.168.10.1
dhcp-option=tag:rede10,option:dns-server,8.8.8.8,1.1.1.1
dhcp-option=tag:rede10,option:ntp-server,192.168.50.20

# --- POOL REDE 20 (VLAN 20 / VLAN_VOZ: 192.168.20.0/24) ---
dhcp-range=set:rede20,192.168.20.100,192.168.20.200,255.255.255.0,12h
dhcp-option=tag:rede20,option:router,192.168.20.1
dhcp-option=tag:rede20,option:dns-server,8.8.8.8,1.1.1.1
dhcp-option=tag:rede20,option:ntp-server,192.168.50.20

# --- Cadeia até aqui ---
# Cliente (VLAN 10/20) -> broadcast DHCP -> switch de acesso -> trunk até o
# CSW001 -> trunk até o CR001 -> "ip helper-address 192.168.50.10" nas
# subinterfaces Fa0/0.10 e Fa0/0.20 -> unicast até este servidor, na VLAN 50.
# Por isso o helper-address é essencial: sem ele, o broadcast DHCP nunca sai
# da VLAN de origem e não alcançaria este servidor, que fica em outra VLAN.

# --- Evidência de funcionamento (leases concedidos) ---
# /var/lib/misc/dnsmasq.leases em 22/09/2026:
#   192.168.10.160 -> CLIENTVL10 (00:50:79:66:68:00)
#   192.168.20.161 -> CLIENTVL20 (00:50:79:66:68:01)
