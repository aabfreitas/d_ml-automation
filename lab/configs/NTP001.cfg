# CD-SP1-NTP001 — servidor NTP (container Linux, chrony)
# Extraído do laboratório em 22/09/2026.

# --- Rede (/etc/network/interfaces) ---
auto eth0
iface eth0 inet static
    address 192.168.50.20
    netmask 255.255.255.0
    gateway 192.168.50.1
    up echo "nameserver 8.8.8.8" > /etc/resolv.conf

# --- Serviço NTP (/etc/chrony/chrony.conf, linhas ativas) ---
confdir /etc/chrony/conf.d
pool pool.ntp.org iburst
sourcedir /etc/chrony/sources.d
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony
maxupdateskew 100.0
rtcsync
makestep 1.0 3
cmdport 0

# Só os três switches/roteador (VLAN 50, 10, 20) podem consultar este NTP.
allow 192.168.10.0/24
allow 192.168.20.0/24
allow 192.168.50.0/24

# stratum 10: o container não tem hardware de relógio de referência, então
# assume um stratum alto (relógio pouco confiável) e sincroniza com o pool
# público — os clientes internos (switches/roteador) ainda o tratam como
# fonte válida, só não sobe mais fundo na hierarquia NTP.
local stratum 10

# --- Evidência de funcionamento ---
# `chronyc tracking` em 22/09/2026: Stratum 10, Leap status Normal.
#
# `chronyc clients` mostra os 4 dispositivos da rede consultando este NTP:
#   192.168.50.1 (CR001)    — 47 pacotes NTP recebidos
#   192.168.50.6 (CSW001)   — 44 pacotes NTP recebidos
#   192.168.50.7 (SW001)    — 51 pacotes NTP recebidos
#   192.168.50.8 (SW002)    — 28 pacotes NTP recebidos
# Isso confirma que os quatro equipamentos Cisco estão sincronizando o
# relógio com este servidor, e não apenas com a configuração "ntp server"
# presente na running-config de cada um.
#
# --- Confirmação do lado Cisco (23/09/2026) ---
# `show ntp associations` no CD-SP1-CR001:
#
#   address          ref clock       st  when  poll  reach  delay   offset   disp
#  *~192.168.50.20    127.127.1.1    10    53    64      3   35.911  542.106  3937.7
#   * sys.peer, # selected, + candidate, - outlyer, x falseticker, ~ configured
#
# "reach 64" (binário 1000000, todas as últimas 8 tentativas de sincronização
# bem-sucedidas) e o "*" antes do endereço (marcando-o como sys.peer, a fonte
# de tempo que o roteador realmente escolheu usar) confirmam a sincronização
# de ponta a ponta — não só o servidor relatando clientes consultando-o, mas
# o próprio roteador Cisco relatando esse servidor como sua referência ativa
# de horário.
